[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-json-benchmark"
version = "1.0.0"
description = "Comprehensive benchmarking suite for streaming JSON parser implementations"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Streaming JSON Benchmark Team", email = "benchmark@example.com" }]
maintainers = [{ name = "Streaming JSON Benchmark Team", email = "benchmark@example.com" }]
keywords = ["json", "streaming", "parser", "benchmark", "performance", "serialization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.8"
dependencies = [
    "pandas>=2.3.3",
    "numpy>=2.0.2",
    "ujson>=5.11.0",
    "pymongo>=4.16.0",
    "cbor2>=5.9.0",
    "msgpack>=1.1.2",
    "protobuf>=6.33.6",
    "flatbuffers>=25.12.19",
    "pyarrow>=21.0.0",
    "reactivex>=4.1.0",
    "psutil>=7.2.2",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "tqdm>=4.67.3",
    "colorama>=0.4.4",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-benchmark>=5.2.3",
    "black>=25.11.0",
    "flake8>=7.3.0",
    "mypy>=1.19.1",
    "isort>=6.1.0",
    "pre-commit>=4.3.0",
]
docs = [
    "sphinx>=7.4.7",
    "sphinx-rtd-theme>=3.1.0",
    "myst-parser>=3.0.1",
]

[project.urls]
Homepage = "https://github.com/example/streaming-json-benchmark"
Documentation = "https://streaming-json-benchmark.readthedocs.io/"
Repository = "https://github.com/example/streaming-json-benchmark.git"
"Bug Tracker" = "https://github.com/example/streaming-json-benchmark/issues"
Changelog = "https://github.com/example/streaming-json-benchmark/blob/main/CHANGELOG.md"

[project.scripts]
streaming-benchmark = "main:main"
benchmark-report = "simulation.report_generator:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["serializers*", "simulation*", "tests*"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.yml", "*.yaml", "*.json"]

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["serializers", "simulation", "tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "ujson.*",
    "pymongo.*",
    "cbor2.*",
    "msgpack.*",
    "flatbuffers.*",
    "reactivex.*",
    "psutil.*",
    "matplotlib.*",
    "seaborn.*",
    "tqdm.*",
    "colorama.*",
    "tabulate.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
pythonpath = [
    "src",
    "src/serializers",
    "src/serializers/anyio",
    "src/serializers/raw",
    "src/serializers/solid"
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "benchmark: marks tests as benchmark tests",
]
filterwarnings = [
    "ignore::_pytest.warning_types.PytestAssertRewriteWarning",
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
    "ignore:.* is deprecated.*:DeprecationWarning",
    "ignore:.* is deprecated.*:FutureWarning",
    "ignore:.* is deprecated.*:UserWarning",
]

[tool.coverage.run]
source = ["serializers", "simulation"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.pylint.messages_control]
disable = [
    "arguments-differ",
    "attribute-defined-outside-init",
    "bad-continuation",
    "blacklisted-name",
    "duplicate-code",
    "fixme",
    "import-error",
    "no-member",
    "no-name-in-module",
    "no-self-use",
    "protected-access",
    "stop-iteration-return",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-return-statements",
    "too-many-statements",
    "abstract-method",
    "chained-comparison",
    "eval-used",
    "exec-used",
    "expression-not-assigned",
    "global-statement",
    "missing-docstring",
    "redefined-argument-from-local",
    "redefined-outer-name",
    "reimported",
    "too-many-ancestors",
    "unexpected-special-method-signature",
]
